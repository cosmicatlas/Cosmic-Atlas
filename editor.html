<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter Editor | Cosmic Atlas</title><meta name="theme-color" content="#070a14"><link rel="stylesheet" href="style.css"></head><body>
<header id="top"></header><main>
<p class="crumb"><a href="index.html">Cosmic Atlas</a> / Owner editor</p>
<h1>Chapter editor</h1>
<p class="lede">Private publishing workspace. Only the linked GitHub account <strong>cosmicatlas</strong> can save changes.</p>
<section class="card">
<p id="editor-status" role="status" aria-live="polite">Checking your sign-in…</p>
<div id="editor-login" hidden><p>Sign in with the owner GitHub account to continue.</p><button class="btn" id="editor-github" type="button">Continue with GitHub</button></div>
<div id="editor-form" hidden>
<label for="chapter-number">Chapter number</label><input id="chapter-number" type="number" min="1" step="1" value="2">
<label for="chapter-title">Title</label><input id="chapter-title" maxlength="180">
<label for="chapter-summary">Summary</label><textarea id="chapter-summary" rows="3" maxlength="2000"></textarea>
<label for="chapter-body">Chapter text (Markdown)</label><textarea id="chapter-body" rows="16" maxlength="50000"></textarea>
<label for="chapter-references">References and research notes</label><textarea id="chapter-references" rows="6" maxlength="12000"></textarea>
<div class="actions"><button class="btn" id="load-chapter" type="button">Load chapter</button><button class="btn" id="save-chapter" type="button">Save chapter</button><button class="btn alt" id="editor-signout" type="button">Sign out</button></div>
</div></section>
<p><a href="index.html">Back to Cosmic Atlas</a></p>
</main><footer id="foot"></footer>
<script src="data.js"></script><script src="app.js"></script><script src="supabase-config.js"></script><script type="module" src="editor.js"></script></body></html>
